<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="./output.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

  <title>Registro INBEFIC</title>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="min-h-screen flex flex-col">

        <!-- ENCABEZADO -->
        <header class="relative z-10 mx-auto flex w-full max-w-7xl flex-col items-center
        gap-4 px-6 pb-6 pt-20 sm:flex-row sm:items-center sm:gap-6 sm:px-10 sm:pt-12">

            <!-- LOGO -->
            <div class="shrink-0">
                <img
                    src="../img/INBEFIC.jpg"
                    alt="Logo del Instituto Nacional Prof. Bertha Fidelia Cañas"
                    class="h-32 w-32 object-contain sm:h-40 sm:w-40">
            </div>

            <!-- NOMBRE INSTITUCIÓN -->
            <div class="text-center sm:border-l sm:border-slate-300 sm:pl-7 sm:text-left">

                <h1 class="text-3xl font-bold tracking-wide text-blue-950 sm:text-4xl">
                    INBEFIC
                </h1>

                <p class="mt-1 text-base leading-6 text-slate-700 sm:text-lg">
                    Instituto Nacional Prof.
                    <br>
                    Bertha Fidelia Cañas
                </p>

            </div>

        </header>


        <!-- FORMULARIO DE REGISTRO -->
        <div class="flex justify-center px-4">

            <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 mb-10">

                <!-- TÍTULO -->
                <h2 class="text-3xl font-bold text-center text-blue-950">
                    Registrarse
                </h2>

                <p class="text-center text-slate-600 mt-2 mb-8">
                    Crea una cuenta para acceder a la aplicación.
                </p>


                <!-- FORMULARIO -->
                <form id="registroForm">

                    <!-- NOMBRE -->
                    <div class="mb-5">

                        <label
                            for="nombre"
                            class="block text-sm font-medium text-slate-700 mb-2">

                            Nombre completo

                        </label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ingresa tu nombre completo"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none
                            focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                            required>

                        <p
                            id="errorNombre"
                            class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- CORREO -->
                    <div class="mb-5">

                        <label
                            for="correo"
                            class="block text-sm font-medium text-slate-700 mb-2">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@correo.com"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none
                            focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                            required>

                        <p
                            id="errorCorreo"
                            class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- USUARIO -->
                    <div class="mb-5">

                        <label
                            for="usuario"
                            class="block text-sm font-medium text-slate-700 mb-2">

                            Nombre de usuario

                        </label>

                        <input
                            type="text"
                            id="usuario"
                            placeholder="Ingresa tu nombre de usuario"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none
                            focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                            required>

                        <p
                            id="errorUsuario"
                            class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="mb-5">

                        <label
                            for="password"
                            class="block text-sm font-medium text-slate-700 mb-2">

                            Contraseña

                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password"
                                placeholder="Ingresa tu contraseña"
                                minlength="6"
                                class="w-full px-4 py-3 pr-12 border border-slate-300 rounded-lg outline-none
                                focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                                required>

                            <button
                                type="button"
                                onclick="mostrarPassword('password', 'iconPassword')"
                                class="absolute right-3 top-1/2 -translate-y-1/2
                                text-slate-500 hover:text-blue-600">

                                <i id="iconPassword" class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                        <p
                            id="errorPassword"
                            class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- CONFIRMAR CONTRASEÑA -->
                    <div class="mb-5">

                        <label
                            for="confirmar"
                            class="block text-sm font-medium text-slate-700 mb-2">

                            Confirmar contraseña

                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="confirmar"
                                placeholder="Confirma tu contraseña"
                                class="w-full px-4 py-3 pr-12 border border-slate-300 rounded-lg outline-none
                                focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                                required>

                            <button
                                type="button"
                                onclick="mostrarPassword('confirmar', 'iconConfirmar')"
                                class="absolute right-3 top-1/2 -translate-y-1/2
                                text-slate-500 hover:text-blue-600">

                                <i id="iconConfirmar" class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                        <p
                            id="errorConfirmar"
                            class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- MENSAJE GENERAL -->
                    <p
                        id="mensaje"
                        class="text-center text-sm font-medium mb-4">
                    </p>


                    <!-- BOTÓN REGISTRARSE -->
                    <button
                        type="submit"
                        id="btnRegistrarse"
                        class="flex min-h-16 w-4/5 mx-auto items-center justify-center
                        rounded-2xl bg-blue-700 px-6 py-3 text-white shadow-lg
                        transition duration-300 hover:-translate-y-1 hover:bg-blue-800
                        hover:shadow-xl focus:outline-none focus:ring-4
                        focus:ring-blue-300 active:scale-95">

                        <span class="text-base font-bold sm:text-2xl">
                            Registrarse
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script>

        // Mostrar y ocultar contraseña
        function mostrarPassword(idInput, idIcono) {

            const password = document.getElementById(idInput);
            const icono = document.getElementById(idIcono);

            if (password.type === "password") {

                password.type = "text";

                icono.classList.remove("fa-eye");
                icono.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                icono.classList.remove("fa-eye-slash");
                icono.classList.add("fa-eye");

            }
        }


        // REGISTRO
        const formulario = document.getElementById("registroForm");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();


            const nombre = document.getElementById("nombre");
            const correo = document.getElementById("correo");
            const usuario = document.getElementById("usuario");
            const password = document.getElementById("password");
            const confirmar = document.getElementById("confirmar");

            const errorNombre = document.getElementById("errorNombre");
            const errorCorreo = document.getElementById("errorCorreo");
            const errorUsuario = document.getElementById("errorUsuario");
            const errorPassword = document.getElementById("errorPassword");
            const errorConfirmar = document.getElementById("errorConfirmar");
            const mensaje = document.getElementById("mensaje");


            // Limpiar errores
            errorNombre.textContent = "";
            errorCorreo.textContent = "";
            errorUsuario.textContent = "";
            errorPassword.textContent = "";
            errorConfirmar.textContent = "";
            mensaje.textContent = "";


            let formularioValido = true;


            // VALIDAR NOMBRE
            if (nombre.value.trim() === "") {

                errorNombre.textContent = "El nombre es obligatorio.";
                formularioValido = false;

            }


            // VALIDAR CORREO
            if (correo.value.trim() === "") {

                errorCorreo.textContent = "El correo es obligatorio.";
                formularioValido = false;

            } else if (!correo.validity.valid) {

                errorCorreo.textContent = "Ingresa un correo válido.";
                formularioValido = false;

            }


            // VALIDAR USUARIO
            if (usuario.value.trim() === "") {

                errorUsuario.textContent = "El nombre de usuario es obligatorio.";
                formularioValido = false;

            }


            // VALIDAR CONTRASEÑA
            if (password.value.trim() === "") {

                errorPassword.textContent = "La contraseña es obligatoria.";
                formularioValido = false;

            } else if (password.value.length < 6) {

                errorPassword.textContent =
                    "La contraseña debe tener al menos 6 caracteres.";

                formularioValido = false;

            }


            // VALIDAR CONFIRMACIÓN
            if (confirmar.value.trim() === "") {

                errorConfirmar.textContent =
                    "Debes confirmar la contraseña.";

                formularioValido = false;

            } else if (password.value !== confirmar.value) {

                errorConfirmar.textContent =
                    "Las contraseñas no coinciden.";

                formularioValido = false;

            }


            // SI HAY ERRORES, NO CONTINUAR
            if (!formularioValido) {
                return;
            }


            // GUARDAR USUARIO
            const usuarioRegistrado = {

                nombre: nombre.value.trim(),

                correo: correo.value.trim(),

                usuario: usuario.value.trim(),

                password: password.value

            };


            localStorage.setItem(
                "usuarioINBEFIC",
                JSON.stringify(usuarioRegistrado)
            );


            // Asegurarnos de que no haya una sesión anterior
            localStorage.removeItem("sesionINBEFIC");


            // MENSAJE DE ÉXITO
            mensaje.style.color = "#16803c";

            mensaje.textContent =
                "✓ Registro realizado correctamente.";


            // Esperar un momento y enviar al inicio de sesión
            setTimeout(function() {

                window.location.href = "inicio_sesión.html";

            }, 1000);

        });

    </script>



            <footer class="bg-slate-800 border-t-4 border-red-600 text-white py-6 px-6">

                <p class="text-center text-sm md:text-base">
                   INBEFIC: Plataforma Oficial De Inventario de Recurso Didáctico y Material de Limpieza 

                   <p class="text-center">&copy;2026 Derechos Reservados: Merlyn/Nataly/Dileymi/Sandra/Otoniel</p>

                </p>
                
            </footer>
</body>
</html>
